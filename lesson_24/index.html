<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колледж</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <button onclick="loadStudents()">Студенты</button>
        <button onclick="loadGroups()">Группы</button>
        <button onclick="loadTeachers()">Учителя</button>
        <button onclick="loadSubjects()">Предметы</button>
        <button onclick="loadGrades()">Оценки</button>
    </header>

    <main>
        <table id="studentsTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Фамилия</th>
                    <th>Возраст</th>
                </tr>
            </thead>
            <tbody id="studentBody"></tbody>
        </table>

        <table id="groupsTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Группа</th>
                </tr>
            </thead>
            <tbody id="groupBody"></tbody>
        </table>

        <table id="teachersTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Фамилия</th>
                </tr>
            </thead>
            <tbody id="teacherBody"></tbody>
        </table>

        <table id="subjectsTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Предмет</th>
                    <th>Учитель</th>
                </tr>
            </thead>
            <tbody id="subjectBody"></tbody>
        </table>

        <table id="gradesTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Студент</th>
                    <th>Предмет</th>
                    <th>Оценка</th>
                    <th>Дата</th>
                </tr>
            </thead>
            <tbody id="gradeBody"></tbody>
        </table>

        <section>
            <p>Создать группу</p>
            <form>
                <label>
                    Имя группы
                    <input id="nameGroup" type="text" placeholder="РПО-1" />
                </label>

            </form>

            <button onclick="addGroup()"> Добавить + группу </button>
        </section>

        <section>
            <p>Создать студента</p>
            <form>
                <label>
                    Имя студента
                    <input id="firstNameStudent" type="text" placeholder="Иван" />
                </label>
                <label>
                    Фамилия студента
                    <input id="lastNameStudent" type="text" placeholder="Иванов" />
                </label>
                <label>
                    Возраст студента
                    <input id="ageStudent" type="number" placeholder="18" />
                </label>
                <label>
                    Группа студента
                    <input id="groupId" type="number" placeholder="1" />
                </label>
            </form>

            <button onclick="addStudent()"> Добавить + </button>
        </section>

        <section>
            <p>Изменить студента</p>
            <form>
                <label>
                    ID
                    <input id="idStudentUpdate" type="number" placeholder="введите id студента" />
                </label>
                <label>
                    Имя студента
                    <input id="firstNameUpdate" type="text" placeholder="Иван" />
                </label>
                <label>
                    Фамилия студента
                    <input id="lastNameUpdate" type="text" placeholder="Иванов" />
                </label>
                <label>
                    Возраст студента
                    <input id="ageUpdate" type="number" placeholder="18" />
                </label>
                <label>
                    Группа студента
                    <input id="groupIdUpdate" type="number" placeholder="1" />
                </label>
            </form>

            <button onclick="updateStudent()"> Сохранить + </button>
        </section>

        <section>
            <p>Добавить учителя</p>
            <form>
                <label>
                    Имя учителя
                    <input id="firstNameTeacher" type="text" placeholder="Анна" />
                </label>
                <label>
                    Фамилия учителя
                    <input id="lastNameTeacher" type="text" placeholder="Петрова" />
                </label>
            </form>

            <button onclick="addTeacher()"> Добавить + учителя </button>
        </section>

        <section>
            <p>Добавить предмет</p>
            <form>
                <label>
                    Название предмета
                    <input id="nameSubject" type="text" placeholder="Математика" />
                </label>
                <label>
                    ID учителя
                    <input id="teacherIdSubject" type="number" placeholder="1" />
                </label>
            </form>

            <button onclick="addSubject()"> Добавить + предмет </button>
        </section>

        <section>
            <p>Поставить оценку</p>
            <form>
                <label>
                    ID студента
                    <input id="studentIdGrade" type="number" placeholder="1" />
                </label>
                <label>
                    ID предмета
                    <input id="subjectIdGrade" type="number" placeholder="1" />
                </label>
                <label>
                    Оценка
                    <input id="scoreGrade" type="number" min="1" max="5" placeholder="5" />
                </label>
                <label>
                    Дата
                    <input id="dateGrade" type="date" />
                </label>
            </form>

            <button onclick="addGrade()"> Поставить + оценку </button>
        </section>

        <section>
            <form>
                <label>
                    Удалить студента по ID
                    <input id="idStudentDelete" type="number" placeholder="введите id студента" />
                </label>
                <button onclick="deleteStudent()"> Удалить + </button>
            </form>
        </section>
    </main>

    <footer>
        <p id="gr"></p>
    </footer>

    <script src="js/routes.js"></script>
</body>
</html>
